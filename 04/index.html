<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo 4 — Eventos de MetaMask</title>
  </head>
  <body>
    <main>
      <h1>Demo 4 — Eventos de MetaMask</h1>
      <p>Actualizar la pantalla al cambiar de cuenta o red sin crear listeners duplicados.</p>
      <section class="panel">
        <h2>Operaciones</h2>
        <label for="token">Dirección del contrato DORT en Sepolia</label>
      <input id="token" type="text" placeholder="0x..." autocomplete="off" />
        <div class="actions">
                    <button id="activar">Activar listeners</button>
          <button id="refrescar">Actualizar saldo</button>
          <button id="desactivar">Eliminar listeners</button>
        </div>
      </section>
      <section class="panel" aria-live="polite">
        <h2>Resultado</h2>
        <pre id="resultado">Todavía no se ejecutó ninguna operación.</pre>
      </section>
      <small>Clase 15 · Taller de Tecnologías 2 · Ethereum Sepolia</small>
    </main>
    <script type="module" src="/src/main.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </body>
</html>
